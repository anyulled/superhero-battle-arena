name: "CodeQL Advanced"

on:
    workflow_call:
    schedule:
        - cron: "30 2 * * 3"

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: java-kotlin
                      build-mode: autobuild

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up JDK 25
              uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
              with:
                  java-version: "25"
                  distribution: "temurin"
                  cache: "maven"

            - name: Initialize CodeQL
              uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
              with:
                  category: "/language:${{matrix.language}}"
