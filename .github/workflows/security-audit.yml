name: Security Audit

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false
      NVD_API_KEY:
        required: false
      GUIDE_API_TOKEN:
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Dependency Review
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  security-audit:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Security Audit
    env:
      DEPENDENCY_CHECK_DATA_DIRECTORY: ${{ runner.temp }}/dependency-check-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Derive Dependency-Check cache key
        id: dependency-check-cache-key
        run: echo "key=dependency-check-${RUNNER_OS}-v13-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check data
        id: dependency-check-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIRECTORY }}
          key: ${{ steps.dependency-check-cache-key.outputs.key }}
          restore-keys: |
            dependency-check-${{ runner.os }}-v13-

      - name: Snyk Security Scan
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd

      - name: Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      - name: Scan NVD and Sonatype Guide with OWASP Dependency-Check
        env:
          GUIDE_API_TOKEN: ${{ secrets.GUIDE_API_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: sh scripts/security-audit.sh

      - name: Save Dependency-Check data
        if: success() && steps.dependency-check-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIRECTORY }}
          key: ${{ steps.dependency-check-cache-key.outputs.key }}

      - name: Upload dependency audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
