name: Deploy to Clever Cloud
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    secrets:
      CLEVER_SECRET:
        required: true
      CLEVER_TOKEN:
        required: true
      ORGA_ID:
        required: true
      APPLICATION_ID:
        required: true

concurrency:
  group: clever-cloud-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Clever Cloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Clever Tools
        run: npm install -g clever-tools@4.10.0

      - name: Deploy to Clever Cloud
        env:
          VALIDATED_REVISION: ${{ inputs.revision }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          ORGA_ID: ${{ secrets.ORGA_ID }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
        run: |
          set -euo pipefail

          test "$VALIDATED_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_REVISION"
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$VALIDATED_REVISION" ]; then
            echo "::error::The validated revision is no longer the current main commit."
            exit 1
          fi

          clever login --token "$CLEVER_TOKEN" --secret "$CLEVER_SECRET"

          git checkout -B main
          clever link "$APPLICATION_ID" -o "$ORGA_ID" -a deploy_app
          clever deploy -a deploy_app -b main -f
